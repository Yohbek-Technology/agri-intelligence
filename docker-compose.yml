services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - apps/server/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    develop:
      watch:
        - action: rebuild
          path: ./apps/server
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./packages/shared
          ignore:
            - node_modules/
            - dist/
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_SERVER_URL=http://localhost:5000
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_SERVER_URL=http://localhost:5000
    depends_on:
      server:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./apps/web
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: ./packages/shared
          ignore:
            - node_modules/
            - dist/
    restart: unless-stopped
